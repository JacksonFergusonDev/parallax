[workspace]
resolver = "3"
members = ["app/src-tauri", "crates/*"]

[workspace.package]
edition = "2024"
version = "0.1.0"
publish = false
license = "GPL-3.0-only"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# Keep target/ small: line tables are enough for backtraces, deps need none.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[workspace.dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
clap = { version = "4", features = ["derive"] }
rusqlite = { version = "0.41", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
erc-convert = { path = "crates/convert" }
erc-core = { path = "crates/core" }
erc-device = { path = "crates/device" }
erc-device-kobo = { path = "crates/device-kobo" }
