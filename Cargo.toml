[workspace]
resolver = "3"
members = ["app/src-tauri"]

[workspace.package]
edition = "2024"
version = "0.1.0"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
