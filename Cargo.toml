[workspace]
resolver = "3"
members = ["app/src-tauri", "crates/*"]
exclude = ["vendor/boko"]

[workspace.package]
edition = "2024"
version = "0.1.0"
publish = false
license = "GPL-3.0-only"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Nothing here is published, so API documentation sections and #[must_use]
# annotations would be ceremony without readers.
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
return_self_not_must_use = "allow"
# Style judgements with arbitrary thresholds.
similar_names = "allow"
struct_excessive_bools = "allow"
too_many_lines = "allow"
# Its fix, `assert_eq!(x, [] as [T; 0])`, reads worse than `assert!(x.is_empty())`.
assert_is_empty = "allow"
# Flags Kobo vocabulary (ContentID, KEpub), and clap doc comments are --help
# text, where backticks would show.
doc_markdown = "allow"
# Counts and durations are far below 2^53, and the results are only displayed.
cast_precision_loss = "allow"
# Saves an allocation on cold paths, at the cost of an ignored `write!` Result.
format_collect = "allow"
format_push_string = "allow"

# Keep target/ small: line tables are enough for backtraces, deps need none.
[profile.dev]
debug = "line-tables-only"

# Dependencies rarely rebuild, so optimising them costs one slower clean build.
# Unoptimised, decoding images and parsing EPUBs is 5-30x slower.
[profile.dev.package."*"]
debug = false
opt-level = 3

# erc-comic's own per-pixel loops (greyscale, packing, colour checks) are
# workspace code, so the rule above skips them. Unoptimised, preparing a
# 219-page volume took 34 s instead of 6 s.
[profile.dev.package.erc-comic]
opt-level = 3

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[workspace.dependencies]
anyhow = "1"
boko = { version = "0.6.0", default-features = false }
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
clap = { version = "4", features = ["derive"] }
comfy-table = "8"
console = "0.16"
indicatif = "0.18"
reqwest = { version = "0.13", features = ["blocking", "json", "query"] }
roxmltree = "0.21"
rusqlite = { version = "0.41", features = ["bundled", "backup", "fallible_uint"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
compress-tools = "0.16"
thiserror = "2"
zip = { version = "9", default-features = false, features = ["deflate"] }
sha2 = "0.11"
zstd = "0.14"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp"] }
rayon = "1"
uuid = { version = "1", features = ["v4"] }
erc-convert = { path = "crates/convert" }
erc-comic = { path = "crates/comic" }
erc-core = { path = "crates/core" }
erc-covers = { path = "crates/covers" }
erc-upscale = { path = "crates/upscale" }
erc-device = { path = "crates/device" }
erc-epub = { path = "crates/epub" }
erc-library = { path = "crates/library" }
erc-metadata = { path = "crates/metadata" }
erc-device-kobo = { path = "crates/device-kobo" }

# boko with two fixes that aren't released yet; see vendor/boko/VENDORED.md.
[patch.crates-io]
boko = { path = "vendor/boko" }
