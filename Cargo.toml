[workspace]
resolver = "3"
members = ["app/src-tauri", "crates/*"]

[workspace.package]
edition = "2024"
version = "0.1.0"
publish = false
license = "GPL-3.0-only"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# Keep target/ small: line tables are enough for backtraces, deps need none.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

# Decoding images unoptimised is about 30x slower, which is noticeable when
# reading a whole library's covers. These rarely rebuild, so it costs little.
[profile.dev.package.image]
opt-level = 3

[profile.dev.package.zune-jpeg]
opt-level = 3

[profile.dev.package.zune-core]
opt-level = 3

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[workspace.dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
clap = { version = "4", features = ["derive"] }
comfy-table = "8"
console = "0.16"
indicatif = "0.18"
reqwest = { version = "0.13", features = ["blocking", "json", "query"] }
roxmltree = "0.21"
rusqlite = { version = "0.41", features = ["bundled", "backup"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
zip = { version = "9", default-features = false, features = ["deflate"] }
sha2 = "0.11"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp"] }
uuid = { version = "1", features = ["v4"] }
erc-convert = { path = "crates/convert" }
erc-core = { path = "crates/core" }
erc-covers = { path = "crates/covers" }
erc-upscale = { path = "crates/upscale" }
erc-device = { path = "crates/device" }
erc-epub = { path = "crates/epub" }
erc-library = { path = "crates/library" }
erc-metadata = { path = "crates/metadata" }
erc-device-kobo = { path = "crates/device-kobo" }
