[package]
name = "kobo-comics-spike"
version = "0.1.0"
edition = "2024"
publish = false
license = "GPL-3.0-only"

# Standalone: not a member of the main workspace.
[workspace]

[dependencies]
anyhow = "1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
png = "0.18"
rayon = "1"
sha2 = "0.10"
zip = { version = "9", default-features = false, features = ["deflate"] }

[profile.release]
opt-level = 3
