[package]
name = "spike"
version = "0.1.0"
edition = "2021"
[workspace]
[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }
[dependencies]
tauri = { version = "=2.12.5", features = ["custom-protocol", "protocol-asset"] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
zip = { version = "9", default-features = false, features = ["deflate"] }
objc2 = "0.6"
objc2-app-kit = "0.3"
objc2-foundation = "0.3"
objc2-web-kit = "0.3"
block2 = "0.6"
[profile.release]
opt-level = 1
debug = false
