name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:

permissions:
  contents: read

# Replace stale PR runs, and keep a separate run for each push to main.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  frontend:
    name: Frontend and repository checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: app/package.json

      - name: Install Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: "1.59.0"

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false

      - name: Install Rustfmt
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: rustfmt

      - name: Check Rust formatting
        run: cargo fmt --all --check

      - name: Check justfile format
        run: just --fmt --check --unstable

      - name: Lint Markdown
        run: uvx rumdl check --output-format github .

      - name: Validate workflows
        run: uvx prek run actionlint --all-files

      - name: Audit workflow security
        run: uvx zizmor --offline .github/

      - name: Install frontend dependencies
        run: pnpm --dir app install --frozen-lockfile

      - name: Check frontend formatting
        run: pnpm --dir app format:check

      - name: Lint frontend
        run: pnpm --dir app lint

      - name: Check TypeScript
        run: pnpm --dir app typecheck

      - name: Check Python scripts
        run: just check-scripts

      - name: Test frontend
        run: pnpm --dir app test

      - name: Build frontend
        run: pnpm --dir app build

  macos:
    name: macOS
    uses: ./.github/workflows/native.yml # zizmor: ignore[self-repository] actionlint resolves the local workflow with this syntax.
    with:
      targets: >-
        [
          {"platform": "macOS arm64", "os": "macos-15", "target": "aarch64-apple-darwin"},
          {"platform": "macOS x64", "os": "macos-15-intel", "target": "x86_64-apple-darwin"}
        ]

  webview:
    name: WKWebView integration / ${{ matrix.label }}
    runs-on: macos-15
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: epub
            label: EPUB reader
          - shard: desktop
            label: Settings, menus and comics
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install native Rust toolchain
        id: rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable-aarch64-apple-darwin

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false

      - name: Fetch native kepubify
        run: uv run --directory scripts --no-project python fetch_kepubify.py

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: app/package.json

      - name: Install Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      - name: Install frontend dependencies
        run: pnpm --dir app install --frozen-lockfile

      - name: Build frontend for WKWebView
        run: pnpm --dir app build

      - name: Restore full macOS Rust cache
        uses: ./.github/actions/macos-rust-cache # zizmor: ignore[self-repository] actionlint resolves the local action with this syntax.
        with:
          target: aarch64-apple-darwin
          rust-version: ${{ steps.rust.outputs.cachekey }}

      - name: Build WKWebView test executables
        run: cargo build --locked -p parallax-app -p parallax-cli --features parallax-app/e2e

      - name: Test reader and Settings in WKWebView
        env:
          CARGO_TARGET_DIR: target
          READER_E2E_NO_BUILD: "1"
          READER_E2E_SHARD: ${{ matrix.shard }}
        run: node --test scripts/reader-e2e.mjs

      - name: Mark the completed build for caching
        run: python3 scripts/restore_cargo_input_times.py --finished
