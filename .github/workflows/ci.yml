name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:

permissions:
  contents: read

# Replace stale PR runs, and keep a separate run for each push to main.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  frontend:
    name: Frontend and repository checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: app/package.json

      - name: Install Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: "1.59.0"

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false

      - name: Check justfile format
        run: just --fmt --check --unstable

      - name: Lint Markdown
        run: uvx rumdl check --output-format github .

      - name: Validate workflows
        run: uvx prek run actionlint --all-files

      - name: Audit workflow security
        run: uvx zizmor --offline .github/

      - name: Install frontend dependencies
        run: pnpm --dir app install --frozen-lockfile

      - name: Check frontend formatting
        run: pnpm --dir app format:check

      - name: Lint frontend
        run: pnpm --dir app lint

      - name: Check TypeScript
        run: pnpm --dir app typecheck

      - name: Test frontend and development scripts
        run: |
          pnpm --dir app test
          node --test scripts/dev.test.mjs

      - name: Build frontend
        run: pnpm --dir app build

  native:
    name: Rust and desktop / ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Linux x64
            os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - platform: Linux arm64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - platform: Windows x64
            os: windows-2025
            target: x86_64-pc-windows-msvc
            vcpkg-triplet: x64-windows-static-md
          - platform: Windows arm64
            os: windows-11-arm
            target: aarch64-pc-windows-msvc
            vcpkg-triplet: arm64-windows-static-md
          - platform: macOS arm64
            os: macos-15
            target: aarch64-apple-darwin
            webview: true
          # Keep existing Intel Mac coverage for architecture-specific code.
          - platform: macOS x64
            os: macos-15-intel
            target: x86_64-apple-darwin

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install native Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable-${{ matrix.target }}
          components: rustfmt, clippy

      - name: Confirm native Rust architecture
        env:
          EXPECTED_TARGET: ${{ matrix.target }}
        run: |
          rustc -vV
          test "$(rustc -vV | awk '/^host: / {print $2}' | tr -d '\r')" = "$EXPECTED_TARGET"

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.target }}

      - name: Install Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libarchive-dev libwebkit2gtk-4.1-dev libxdo-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install Windows libarchive
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          VCPKGRS_TRIPLET: ${{ matrix.vcpkg-triplet }}
        run: |
          $root = $env:VCPKG_INSTALLATION_ROOT
          & "$root/vcpkg.exe" install "libarchive[core,bzip2,lz4,lzma,zstd]:${env:VCPKGRS_TRIPLET}" --classic
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "VCPKG_ROOT=$root" >> $env:GITHUB_ENV
          "VCPKGRS_TRIPLET=$env:VCPKGRS_TRIPLET" >> $env:GITHUB_ENV

      - name: Fetch native kepubify
        run: bash scripts/fetch-kepubify.sh

      - name: Check Rust formatting
        if: matrix.webview
        run: cargo fmt --all --check

      - name: Lint Rust workspace
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Test Rust workspace
        run: cargo test --locked --workspace

      - name: Build desktop executable
        if: ${{ !matrix.webview }}
        run: cargo build --locked -p parallax-app --bin Parallax

      - name: Install pnpm for WebView tests
        if: matrix.webview
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: app/package.json

      - name: Install Node for WebView tests
        if: matrix.webview
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      - name: Install WebView test dependencies
        if: matrix.webview
        run: pnpm --dir app install --frozen-lockfile

      - name: Test reader and Settings in WKWebView
        if: matrix.webview
        env:
          CARGO_TARGET_DIR: target
        run: node --test scripts/reader-e2e.mjs
