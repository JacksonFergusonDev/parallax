name: Native Rust and desktop

on:
  workflow_call:
    inputs:
      targets:
        description: Native targets as a JSON matrix include list
        required: true
        type: string

permissions:
  contents: read

jobs:
  native:
    name: Rust and desktop / ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.targets) }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install native Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable-${{ matrix.target }}
          components: rustfmt, clippy

      - name: Confirm native Rust architecture
        env:
          EXPECTED_TARGET: ${{ matrix.target }}
        run: |
          rustc -vV
          test "$(rustc -vV | awk '/^host: / {print $2}' | tr -d '\r')" = "$EXPECTED_TARGET"

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.target }}

      - name: Install Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libarchive-dev libwebkit2gtk-4.1-dev libxdo-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install Windows libarchive
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          VCPKGRS_TRIPLET: ${{ matrix.vcpkg-triplet }}
        run: |
          $root = $env:VCPKG_INSTALLATION_ROOT
          & "$root/vcpkg.exe" install "libarchive[core,bzip2,lz4,lzma,zstd]:${env:VCPKGRS_TRIPLET}" --classic
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "VCPKG_ROOT=$root" >> $env:GITHUB_ENV
          "VCPKGRS_TRIPLET=$env:VCPKGRS_TRIPLET" >> $env:GITHUB_ENV

      - name: Fetch native kepubify
        run: bash scripts/fetch-kepubify.sh

      - name: Check Rust formatting
        if: matrix.webview
        run: cargo fmt --all --check

      - name: Lint Rust workspace
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Test Rust workspace
        run: cargo test --locked --workspace --no-fail-fast

      - name: Build desktop and CLI executables
        if: ${{ !matrix.webview }}
        # Keep workspace-wide feature resolution from the test step so Cargo
        # can reuse the libraries it already compiled.
        run: cargo build --locked --workspace --bins

      - name: Install pnpm for WebView tests
        if: matrix.webview
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: app/package.json

      - name: Install Node for WebView tests
        if: matrix.webview
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      - name: Install WebView test dependencies
        if: matrix.webview
        run: pnpm --dir app install --frozen-lockfile

      - name: Test reader and Settings in WKWebView
        if: matrix.webview
        env:
          CARGO_TARGET_DIR: target
        run: node --test scripts/reader-e2e.mjs
