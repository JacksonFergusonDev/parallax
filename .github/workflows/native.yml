name: Native Rust and desktop

on:
  workflow_call:
    inputs:
      targets:
        description: Native targets as a JSON matrix include list
        required: true
        type: string

permissions:
  contents: read

jobs:
  native:
    name: Rust and desktop / ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.targets) }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install native Rust toolchain
        id: rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.100.0-${{ matrix.target }}
          components: clippy

      - name: Confirm native Rust architecture
        env:
          EXPECTED_TARGET: ${{ matrix.target }}
        run: |
          rustc -vV
          test "$(rustc -vV | awk '/^host: / {print $2}' | tr -d '\r')" = "$EXPECTED_TARGET"

      - name: Restore Rust dependencies for portability
        if: runner.os != 'macOS'
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.target }}

      - name: Install Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libarchive-dev libwebkit2gtk-4.1-dev libxdo-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install Windows libarchive
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          VCPKGRS_TRIPLET: ${{ matrix.vcpkg-triplet }}
        run: |
          $root = $env:VCPKG_INSTALLATION_ROOT
          & "$root/vcpkg.exe" install "libarchive[core,bzip2,lz4,lzma,zstd]:${env:VCPKGRS_TRIPLET}" --classic
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "VCPKG_ROOT=$root" >> $env:GITHUB_ENV
          "VCPKGRS_TRIPLET=$env:VCPKGRS_TRIPLET" >> $env:GITHUB_ENV

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false

      - name: Fetch native kepubify
        run: uv run --directory scripts --no-project python fetch_kepubify.py

      - name: Restore full macOS Rust cache
        if: runner.os == 'macOS'
        uses: ./.github/actions/macos-rust-cache # zizmor: ignore[self-repository] actionlint resolves the local action with this syntax.
        with:
          target: ${{ matrix.target }}
          rust-version: ${{ steps.rust.outputs.cachekey }}

      - name: Lint Rust workspace
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Test Rust workspace
        run: cargo test --locked --workspace --no-fail-fast

      - name: Build desktop and CLI executables
        # Keep workspace-wide feature resolution from the test step so Cargo
        # can reuse the libraries it already compiled.
        run: cargo build --locked --workspace --bins

      - name: Mark the completed build for caching
        if: runner.os == 'macOS'
        run: python3 scripts/restore_cargo_input_times.py --finished
