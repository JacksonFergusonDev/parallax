# Builds the site from site/ and publishes it to GitHub Pages at
# parallax.jacksonferguson.me. It runs only when a push to main changes site/
# or this file, when run by hand, and from the release workflow once a release
# is published, so the download button names the new version. The build reads
# the releases from GitHub's API. Other pushes leave the live site alone.
name: Site

on:
  push:
    branches: [ "main" ]
    paths:
      - "site/**"
      - ".github/workflows/site.yml"
  workflow_dispatch:
  workflow_call:

permissions: {}

# Deploys queue rather than cancel, so the newest release always reaches the site.
concurrency:
  group: site-deploy
  cancel-in-progress: false

jobs:
  build:
    name: Build the site
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 10
    permissions:
      contents: read
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # A deploy builds from a clean install: no cache a PR could have written.
      - name: Install pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: site/package.json

      - name: Install Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build against the published releases
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PARALLAX_REQUIRE_RELEASES: "1"
        run: pnpm run build

      - name: Upload the site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy
        id: pages
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
