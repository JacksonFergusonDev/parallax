[package]
name = "parallax-cli"
description = "Manage your Parallax library and Kobo from the terminal"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
repository = "https://github.com/JacksonFergusonDev/parallax"
homepage = "https://parallax.jacksonferguson.me"

[[bin]]
name = "parallax-cli"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
clap.workspace = true
comfy-table.workspace = true
console.workspace = true
parallax-convert.workspace = true
parallax-core.workspace = true
parallax-covers.workspace = true
parallax-device.workspace = true
parallax-device-kobo.workspace = true
parallax-epub.workspace = true
parallax-library.workspace = true
parallax-upscale.workspace = true
indicatif.workspace = true
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true

# Lets `cargo binstall --git https://github.com/JacksonFergusonDev/parallax
# parallax-cli` fetch the release workflow's prebuilt archive instead of
# compiling. The archive holds parallax-cli and kepubify at its root.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ version }-{ target }.tar.gz"
bin-dir = "{ bin }{ binary-ext }"
pkg-fmt = "tgz"
