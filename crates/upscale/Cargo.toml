[package]
name = "parallax-upscale"
description = "Cover upscaling: tiling around a Core ML model (macOS only)"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
image.workspace = true
thiserror.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-core-ml = { version = "0.3", default-features = false, features = ["std", "block2", "MLDictionaryFeatureProvider", "MLFeatureProvider", "MLFeatureValue", "MLModel", "MLModelConfiguration", "MLMultiArray", "MLModel_MLModelCompilation"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "block2", "NSArray", "NSDictionary", "NSError", "NSObject", "NSString", "NSURL", "NSValue"] }

# The workspace forbids unsafe code. The Core ML bridge needs it, so this crate
# denies it instead, which coreml.rs alone can then allow.
[lints.rust]
unsafe_code = "deny"

# Cargo cannot combine `workspace = true` with an override, so keep this table
# identical to [workspace.lints.clippy] in the root Cargo.toml.
[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Nothing here is published, so API documentation sections and #[must_use]
# annotations would be ceremony without readers.
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
return_self_not_must_use = "allow"
# Style judgements with arbitrary thresholds.
similar_names = "allow"
struct_excessive_bools = "allow"
too_many_lines = "allow"
# Its fix, `assert_eq!(x, [] as [T; 0])`, reads worse than `assert!(x.is_empty())`.
assert_is_empty = "allow"
# Flags Kobo vocabulary (ContentID, KEpub), and clap doc comments are --help
# text, where backticks would show.
doc_markdown = "allow"
# Counts and durations are far below 2^53, and the results are only displayed.
cast_precision_loss = "allow"
# Saves an allocation on cold paths, at the cost of an ignored `write!` Result.
format_collect = "allow"
format_push_string = "allow"
