[package]
name = "parallax-app"
description = "Parallax desktop app"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[[bin]]
name = "Parallax"
path = "src/main.rs"

[lib]
# The `_lib` suffix avoids a name clash with the bin target on Windows (cargo#8519).
name = "parallax_app_lib"
# Keep the desktop library's output names distinct across feature sets.
crate-type = ["rlib"]

[features]
# Test hooks for scripts/reader-e2e.mjs. Never in a normal or release build.
e2e = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-window-state = "2"
parallax-comic.workspace = true
parallax-convert.workspace = true
parallax-core.workspace = true
parallax-covers.workspace = true
parallax-device.workspace = true
parallax-device-kobo.workspace = true
parallax-epub.workspace = true
parallax-library.workspace = true
parallax-metadata.workspace = true
parallax-upscale.workspace = true
serde.workspace = true
serde_json.workspace = true
tauri-plugin-updater = "2"
tokio = { version = "1", features = ["time"] }

[dev-dependencies]
tauri = { version = "2", features = ["protocol-asset", "test"] }

[lints]
workspace = true
