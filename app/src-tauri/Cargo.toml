[package]
name = "erc-app"
description = "Parallax desktop app"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[[bin]]
name = "Parallax"
path = "src/main.rs"

[lib]
# The `_lib` suffix avoids a name clash with the bin target on Windows (cargo#8519).
name = "erc_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# Test hooks for scripts/reader-e2e.mjs. Never in a normal or release build.
e2e = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-window-state = "2"
erc-comic.workspace = true
erc-convert.workspace = true
erc-core.workspace = true
erc-covers.workspace = true
erc-device.workspace = true
erc-device-kobo.workspace = true
erc-epub.workspace = true
erc-library.workspace = true
erc-upscale.workspace = true
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
tauri = { version = "2", features = ["protocol-asset", "test"] }

[lints]
workspace = true
