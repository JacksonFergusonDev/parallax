[package]
name = "erc-app"
description = "E-Reader Companion desktop app"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[lib]
# The `_lib` suffix avoids a name clash with the bin target on Windows (cargo#8519).
name = "erc_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
erc-convert.workspace = true
erc-core.workspace = true
erc-device.workspace = true
erc-device-kobo.workspace = true
serde.workspace = true
serde_json.workspace = true

[lints]
workspace = true
